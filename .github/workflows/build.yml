name: Build iOS Location Spoofer IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build GoSpoofer
        run: |
          cd GoSpoofer
          chmod +x make.sh
          ./make.sh

      - name: Fix Xcode Project Settings
        run: |
          # Bypass GitHub's new Homebrew trust issues
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install xcodegen
          
          # Nuke the author's code signing AND VPN entitlements
          sed -i '' 's/CODE_SIGN_STYLE: Manual/CODE_SIGN_STYLE: Automatic/g' project.yml
          sed -i '' '/CODE_SIGN_IDENTITY/d' project.yml
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' project.yml
          sed -i '' '/DEVELOPMENT_TEAM/d' project.yml
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' project.yml
          sed -i '' 's/codeSign: true/codeSign: false/g' project.yml
          sed -i '' 's/"18.0"/"17.0"/g' project.yml
          
          # Regenerate the Xcode project file cleanly
          xcodegen generate

      - name: Build Xcode Project
        run: |
          xcodebuild build \
            -project location-spoofer.xcodeproj \
            -scheme location-spoofer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/location-spoofer.app Payload/
          zip -r location-spoofer.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: location-spoofer-ipa
          path: location-spoofer.ipa
