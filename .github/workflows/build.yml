name: Build iOS Location Spoofer IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build GoSpoofer
        run: |
          cd GoSpoofer
          chmod +x make.sh
          ./make.sh

      - name: Nuke App Group & Patch Source Code
        run: |
          cat << 'EOF' > patch.py
          import re
          
          def patch(path, pattern, repl, flags=re.MULTILINE):
              with open(path, 'r', encoding='utf-8') as f:
                  c = f.read()
              new_c = re.sub(pattern, repl, c, flags=flags)
              if new_c == c:
                  print(f"FAILED to patch {path}: pattern not found!")
                  exit(1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(new_c)
              print(f"Successfully patched {path}")
              
          def try_patch(path, pattern, repl, flags=re.MULTILINE):
              try: patch(path, pattern, repl, flags)
              except: pass
          
          # Fix syntax errors in map views
          try_patch("App/MapHomeView.swift", r'finish failed:\\\(errMsg \?\? "VPN start failed"\)', r'finish failed:\(errMsg ?? "VPN start failed")")')
          try_patch("App/MapHomeView.swift", r'finish failed:\\\(errMsg \?\? "VPN reconnect failed"\)', r'finish failed:\(errMsg ?? "VPN reconnect failed")")')
          try_patch("App/SettingsView.swift", r'Run "Set as Location" once', r'Run \"Set as Location\" once')
          
          # Bypass the IPC check since Signulous breaks Apple's IPC entitlement!
          patch("App/MapHomeView.swift",
              r"private func confirmCoordsReady\(expectedLat: Double, expectedLon: Double, timeout: TimeInterval, completion: @escaping \(Bool\) -> Void\) \{",
              r"private func confirmCoordsReady(expectedLat: Double, expectedLon: Double, timeout: TimeInterval, completion: @escaping (Bool) -> Void) {\n        completion(true); return")
          
          # Patch CertificateInstaller to use standard UserDefaults instead of broken App Group
          patch("App/CertificateInstaller.swift",
              r'self\.userDefaults = UserDefaults\(suiteName: "group\.dev\.duti\.location-spoofer"\)!',
              'self.userDefaults = UserDefaults.standard')
          
          # Pass coords AND certificates via memory to bypass sandbox
          patch("App/MapHomeView.swift", 
              r"try manager\.connection\.startVPNTunnel\(\)", 
              'let cert = UserDefaults.standard.string(forKey: "LOCATIONSPOOFER_CA_Certificate") ?? ""; let key = UserDefaults.standard.string(forKey: "LOCATIONSPOOFER_CA_PrivateKey") ?? ""; let opts: [String: NSObject] = ["lat": NSNumber(value: expectedLat), "lon": NSNumber(value: expectedLon), "cert": cert as NSString, "key": key as NSString]; try manager.connection.startVPNTunnel(options: opts)')
          
          # Remove App Group forced-unwrap crash in LocationConfiguration
          patch("App/LocationConfiguration.swift",
              r"guard let defaults = UserDefaults\(suiteName: suiteName\) else \{",
              'if false {')
          patch("App/LocationConfiguration.swift",
              r"self\.userDefaults = defaults",
              'self.userDefaults = UserDefaults.standard')
          
          # Inject global variables for cert passing in PacketTunnelProvider
          patch("Tunnel/PacketTunnelProvider.swift",
              r"class PacketTunnelProvider: NEPacketTunnelProvider \{",
              "var sharedPassedCert: String? = nil\nvar sharedPassedKey: String? = nil\n\nclass PacketTunnelProvider: NEPacketTunnelProvider {")
          
          # Read coords and certs from memory in PacketTunnelProvider
          packet_tunnel_repl = (
              "var lat = configuration.currentCoordinates?.latitude\n"
              "        var lon = configuration.currentCoordinates?.longitude\n"
              "        if let opts = options {\n"
              "            if let oLat = opts[\"lat\"] as? NSNumber, let oLon = opts[\"lon\"] as? NSNumber { lat = oLat.doubleValue; lon = oLon.doubleValue }\n"
              "            if let oCert = opts[\"cert\"] as? String { sharedPassedCert = oCert }\n"
              "            if let oKey = opts[\"key\"] as? String { sharedPassedKey = oKey }\n"
              "        }"
          )
          
          patch("Tunnel/PacketTunnelProvider.swift",
              r"let coords = configuration\.currentCoordinates\s+let lat = coords\?\.latitude\s+let lon = coords\?\.longitude",
              packet_tunnel_repl)
          
          # Patch GoLocationSpoofer to use the passed certificates instead of App Group
          patch("Tunnel/GoLocationSpoofer.swift",
              r"private func getStoredCertificates\(\) -> \(cert: String, key: String\)\? \{",
              "private func getStoredCertificates() -> (cert: String, key: String)? {\n        if let c = sharedPassedCert, let k = sharedPassedKey, !c.isEmpty { return (cert: c, key: k) }")
          
          patch("Tunnel/GoLocationSpoofer.swift",
              r'let userDefaults = UserDefaults\(suiteName: "group\.dev\.duti\.location-spoofer"\)!',
              'let userDefaults = UserDefaults.standard')
          EOF
          python3 patch.py

      - name: Fix Xcode Project Settings
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install xcodegen
          
          sed -i '' 's/CODE_SIGN_STYLE: Manual/CODE_SIGN_STYLE: Automatic/g' project.yml
          sed -i '' '/CODE_SIGN_IDENTITY/d' project.yml
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' project.yml
          sed -i '' '/DEVELOPMENT_TEAM/d' project.yml
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' project.yml
          sed -i '' 's/codeSign: true/codeSign: false/g' project.yml
          
          xcodegen generate

      - name: Build Xcode Project
        run: |
          brew install xcbeautify
          set -o pipefail
          
          xcodebuild -resolvePackageDependencies -project location-spoofer.xcodeproj -scheme location-spoofer
          
          xcodebuild build \
            -project location-spoofer.xcodeproj \
            -scheme location-spoofer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcbeautify

      - name: Inject VPN Entitlements & Package IPA
        run: |
          brew install ldid
          
          ldid -S"Resources/location-spoofer.entitlements" build/Build/Products/Release-iphoneos/location-spoofer.app/location-spoofer
          ldid -S"Tunnel/location-spoofer-tunnel.entitlements" build/Build/Products/Release-iphoneos/location-spoofer.app/PlugIns/location-spoofer-tunnel.appex/location-spoofer-tunnel
          
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/location-spoofer.app Payload/
          zip -r location-spoofer.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: location-spoofer-ipa
          path: location-spoofer.ipa
